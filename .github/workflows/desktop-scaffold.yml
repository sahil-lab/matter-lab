name: Experimental Windows desktop scaffold

on:
  workflow_dispatch:
    inputs:
      bootstrap_lock:
        description: Generate the initial Cargo.lock for review (not a reproducible release)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-scaffold:
    name: Compile unsigned Windows candidate (no release publication)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Install the pinned Tauri CLI
        run: cargo +1.95.0 install tauri-cli --version 2.12.4 --locked
      - name: Explicit initial dependency-lock bootstrap
        if: inputs.bootstrap_lock
        run: npm run desktop:lock
      - run: npm run desktop:check
      - name: Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Build unsigned candidate using the dependency lock
        run: npm run desktop:build
      - name: Rust diagnostics
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Upload candidate and exact dependency lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-scaffold-not-a-signed-release
          path: |
            apps/desktop/src-tauri/target/release/matterlab-desktop.exe
            apps/desktop/src-tauri/Cargo.lock
            qa/results/desktop*.json
          retention-days: 14
